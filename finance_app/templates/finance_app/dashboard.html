{% extends 'finance_app/base.html' %}
{% block content %}
<h2>Dashboard</h2>
<div class="row my-3">
<div class="col-md-6"><div class="card p-3"><h4>Total: ₹{{ total }}</h4></div></div>
<div class="col-md-6"><div class="card p-3"><h4>This Month: ₹{{ monthly }}</h4></div></div>
</div>
<a href="{% url 'expense_add' %}" class="btn btn-primary mb-3">Add Expense</a>
<a href="{% url 'ai_insights' %}" class="btn btn-info mb-3 text-white">AI Insights</a>
<a href="{% url 'reports' %}" class="btn btn-secondary mb-3">Reports</a>
<div class="card p-4"><canvas id="c" height="100"></canvas></div>
<script>
new Chart(document.getElementById('c'), {
    type: 'bar',
    data: { labels: {{ labels|safe }}, datasets: [{ label: 'Spend', data: {{ data|safe }}, backgroundColor: '#0d6efd' }] }
});
</script>
{% endblock %}
